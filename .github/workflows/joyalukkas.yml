name: Joyalukkas Gold Alert

on:
  schedule:
    - cron: "0 */2 * * *"   # Scheduled check every 2 hours
  workflow_dispatch: {}     # Manual run from GitHub UI
  repository_dispatch:      # Webhook trigger from Telegram
    types: [check_rate]

permissions:
  contents: write

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alert script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py

      - name: Commit and push state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_rate.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update gold rate [skip ci]" && git push)
